workflows:
  ios-release-build:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "codemagic ci"

    environment:
      node: latest
      cocoapods: default
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/App.xcworkspace" # Adjust if inside App.xcodeproj
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.settlemate.nz"

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Sync Capacitor iOS (if applicable)
        script: |
          npx cap sync ios || true

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing profiles and certificates
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up Xcode project code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
