workflows:
  ios-release-build:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "codemagic ci"

    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"   # Points to .xcodeproj because SPM is used
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.settlemate.nz"

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Sync Capacitor iOS (Generates SPM Dependencies)
        script: |
          npx cap sync ios

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing profiles and certificates
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up Xcode project code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
