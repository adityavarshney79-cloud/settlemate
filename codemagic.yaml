workflows:
  ios-release-build:
    name: iOS Release Build (Node.js)
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: latest               # Specifies Node.js environment
      cocoapods: default
      xcode: latest
      groups:
        - appstore_credentials    # Contains APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        XCODE_WORKSPACE: "ios/App.xcworkspace"  # Update path if your .xcworkspace is elsewhere
        XCODE_SCHEME: "App"                     # Update to your Xcode target scheme name
        BUNDLE_ID: "com.settlemate.nz"          # Updated bundle ID

    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
          # Or if using yarn: yarn install

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing profiles and certificates
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up Xcode project code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
