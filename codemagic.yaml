workflows:
  ios-release-build:
    name: iOS App Store Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "codemagic ci"

    environment:
      node: 22 # Changed from 22.x to 22 for Codemagic version manager compatibility
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.settlemate.nz
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Web Application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Fetch and Apply Provisioning Profiles
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --warn-only

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true