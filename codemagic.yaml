workflows:
  ios-release-build:
    name: iOS Release Build
    instance_type: mac_mini_m1
    
    # 1. Add the integration section here:
    integrations:
      app_store_connect: "Your_Key_Name_In_Codemagic" # The name you gave the key in Codemagic Integrations UI

    environment:
      vars:
        BUNDLE_ID: "com.settlemate.nz"
      xcode: latest
      cocoapods: default

    scripts:
      # ... your build scripts ...

    publishing:
      app_store_connect:
        # 2. Keep auth: integration matching the key above
        auth: integration
        submit_to_testflight: true
